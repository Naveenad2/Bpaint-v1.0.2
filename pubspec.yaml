name: paint_billing
description: PaintPro Billing - GST billing & inventory software for paint retailers (India).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Persistence (embedded SQLite, no server required) ---
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: '>=0.5.20 <0.6.0'
  path: ^1.9.0
  path_provider: ^2.1.4

  # --- State ---
  provider: ^6.1.2

  # --- Printing / PDF ---
  pdf: ^3.11.1
  barcode: ^2.2.8
  printing: ^5.13.2

  # --- Utilities ---
  intl: '>=0.19.0 <0.21.0'
  crypto: ^3.0.5
  csv: ^6.0.0
  file_selector: ^1.0.3

  # --- Desktop window chrome ---
  window_manager: '>=0.4.0 <0.6.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
